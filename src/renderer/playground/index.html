<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5173"
    />
    <title>Desktop Buddy: Playground</title>
    <style>
      :root {
        --bg: #14121b;
        --panel: #211e2c;
        --line: #393349;
        --text: #ece8f6;
        --muted: #9d96b3;
        --accent: #8fe3c0;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      #bar h1 {
        font-size: 15px;
        margin: 0 10px 0 0;
      }
      #bar button,
      #bar label {
        background: #2c2839;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 9px;
        font: inherit;
        cursor: pointer;
        user-select: none;
      }
      #bar label input {
        margin: 0 5px 0 0;
        vertical-align: -1px;
      }
      #bar button:hover,
      #bar label:hover {
        border-color: var(--accent);
      }
      #status {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #wrap {
        position: relative;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      body.test-mode {
        grid-template-rows: 1fr;
      }
      body.test-mode #bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="bar"><h1>Playground</h1></div>
    <div id="wrap"><canvas id="stage"></canvas></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
